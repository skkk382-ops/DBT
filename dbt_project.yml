name: 'practice_dbt'
version: '1.0.0'

# Which database profile to use for this project
profile: 'practice_dbt'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  practice_dbt:
    # Config indicated by + and applies to all files under models/example/
    example:
      +materialized: view
